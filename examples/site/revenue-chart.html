<dotquilt-region id="revenue" state="pending" aria-label="Revenue in 2026">
  <dotquilt-chart-loader
    slot="placeholder"
    variant="line"
    style="height: 160px"
  ></dotquilt-chart-loader>
  <svg
    viewBox="0 0 320 160"
    preserveAspectRatio="none"
    style="display: block; width: 100%; height: 160px"
    role="img"
    aria-label="Revenue in 2026, by month"
  >
    <path
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      vector-effect="non-scaling-stroke"
    />
  </svg>
  <p class="chart-error" role="alert" hidden>
    We couldn't load revenue. Try again later.
  </p>
</dotquilt-region>

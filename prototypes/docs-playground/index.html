/* Picker chrome is copied verbatim from the prototype skill. */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;

<body>
<a href="#main" class="skip">Skip to content</a>
<div id="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Guide</button>
  <button class="proto-picker-item">Workbench</button>
  <button class="proto-picker-item">Gallery</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<dialog id="search-dialog" aria-labelledby="search-title">
  <div class="dialog-head"><h2 id="search-title">Find a topic</h2><button class="subtle-btn" data-action="close-search">Close</button></div>
  <label class="sr-only" for="search-input">Search documentation topics</label><input id="search-input" type="search" placeholder="Try readiness, styling, or installation…" autocomplete="off" spellcheck="false">
  <div class="search-results" id="search-results"></div>
</dialog>
<dialog id="copy-dialog" aria-labelledby="copy-title"><div class="dialog-head"><h2 id="copy-title">Copy this text</h2><button class="subtle-btn" data-action="close-copy">Close</button></div><p style="font-size:12px;margin-bottom:12px">Automatic clipboard access is unavailable. The text below is selected so you can copy it with your browser’s copy command.</p><label class="sr-only" for="copy-text">Text to copy</label><textarea id="copy-text" readonly rows="8" style="width:100%;padding:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:5px;font-size:12px"></textarea></dialog>
<noscript><main style="max-width:700px;margin:60px auto;padding:20px"><h1>Dotquilt documentation directions</h1><p>This isolated interaction prototype requires JavaScript. The planned production documentation must remain readable without it. No package has been built or published.</p></main></noscript>
<script>
'use strict';
// This is an isolated design model. It does not import or implement the package.
const params = new URLSearchParams(location.search);
if(params.has('v')&&![1,2,3].includes(Number(params.get('v')))){const u=new URL(location);u.searchParams.set('v','1');history.replaceState(null,'',u);}
const allowed = (key,values,fallback) => values.includes(params.get(key)) ? params.get(key) : fallback;
const asNumber = (value,min,max,fallback) => Number.isFinite(Number(value)) && value !== null ? Math.min(max,Math.max(min,Math.round(Number(value)))) : fallback;
const recipes = {
  skeleton: { title:'SkeletonText', short:'Profile', subtitle:'A readable shape for content that is on its way.', description:'Reserve a place for a paragraph. Keep your content mounted, and let your application decide when it is ready.', component:'SkeletonText', register:'registerSkeletonText', entry:'skeleton', tag:'dotquilt-skeleton-text' },
  text: { title:'TextLoader', short:'Metric', subtitle:'A compact loading treatment for inline text.', description:'Give an unknown value a useful placeholder. Zero, empty text, and international text remain valid content.', component:'TextLoader', register:'registerTextLoader', entry:'text', tag:'dotquilt-text' },
  chart: { title:'ChartLoader', short:'Chart', subtitle:'A quiet silhouette before the real chart arrives.', description:'Show a decorative chart shape while your application prepares the real chart. No chart library is required by core.', component:'ChartLoader', register:'registerChartLoader', entry:'chart', tag:'dotquilt-chart' }
};
let cfg = { integration:allowed('integration',['react','native'],'react'), family:allowed('family',Object.keys(recipes),'skeleton'), lines:asNumber(params.get('lines'),1,6,3), theme:allowed('theme',['light','dark'],'light'), color:/^#[0-9a-f]{6}$/i.test(params.get('color')||'') ? params.get('color') : '#7c8676', reduced:params.get('reduced')==='1', view:allowed('view',['home','docs','playground'],'docs') };
let paused=false; try { paused=localStorage.getItem('dotquilt-prototype-paused')==='1'; } catch {}
let presentation='ready', outcome='content', cycle=0, timers=[], motionDeadline=0, motionBudgetTimer, layoutName='guide';
const osReduced=matchMedia('(prefers-reduced-motion: reduce)');
const sections=[['demo','Live example'],['start','Getting started'],['readiness','Readiness & reloads'],['customize','Styling'],['accessibility','Accessibility'],['reference','API reference'],['releases','Versions & limits']];
const escapeHTML = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateURL(){ const u=new URL(location); Object.entries(cfg).forEach(([k,v])=>u.searchParams.set(k,k==='reduced'?(v?'1':'0'):String(v))); history.replaceState(null,'',u);document.querySelectorAll('a[data-view]').forEach(a=>a.href=href(a.dataset.view,a.dataset.anchor||''));document.querySelectorAll('a[data-family]').forEach(a=>a.href=familyHref(a.dataset.family)); }
function familyHref(family){const u=new URL(location);u.searchParams.set('view','docs');u.searchParams.set('family',family);u.hash='demo';return u.pathname+u.search+u.hash;}
function href(view,hash=''){ const u=new URL(location); u.searchParams.set('view',view); u.hash=hash; return u.pathname+u.search+u.hash; }
function logo(){ return '<span class="brand-mark" aria-hidden="true">'+ '<i></i>'.repeat(9)+'</span>'; }
function header(){ return `<header class="topbar"><div class="topinner"><a class="brand" href="${escapeHTML(href('home'))}" data-view="home">${logo()}Dotquilt</a><nav class="topnav" aria-label="Main navigation">${['home','docs','playground'].map(v=>`<a href="${escapeHTML(href(v))}" data-view="${v}" ${cfg.view===v?'aria-current="page"':''}>${v[0].toUpperCase()+v.slice(1)}</a>`).join('')}</nav><div class="toptools"><button class="subtle-btn search-open" data-action="search"><span class="search-text">Find a topic</span><span class="key">⌘ K</span></button><button class="subtle-btn" data-action="pause" aria-pressed="${paused}">${paused?'Resume':'Pause'} animations</button><button class="subtle-btn" data-action="theme" aria-label="Switch to ${cfg.theme==='light'?'dark':'light'} theme">${cfg.theme==='light'?'Dark':'Light'}</button></div></div></header><div class="notice"><span aria-hidden="true"></span>Design prototype · simulated previews · package and snippets are not release-verified</div>`; }
function integrations(){ return `<div class="integration" role="group" aria-label="Code integration"><button data-integration="react" aria-pressed="${cfg.integration==='react'}">React</button><button data-integration="native" aria-pressed="${cfg.integration==='native'}">Web Components</button></div>`; }
function sideNav(){ return `<aside class="sidebar" aria-label="Documentation navigation"><div class="side-group"><h2>Start here</h2><a href="#start">Installation</a><a href="#readiness">Loading model</a></div><div class="side-group"><h2>Components</h2>${Object.entries(recipes).map(([key,r])=>`<a href="${escapeHTML(familyHref(key))}" data-family="${key}" class="${cfg.family===key?'active':''}" ${cfg.family===key?'aria-current="true"':''}>${r.title}</a>`).join('')}</div><div class="side-group"><h2>Guides</h2><a href="#customize">Styling & themes</a><a href="#accessibility">Accessibility</a><a href="#reference">API reference</a><a href="#releases">Versions & limits</a></div><div class="side-note">Native at the core.<br>React when you need it.</div></aside>`; }
function mobileNav(){ return `<details class="mobile-nav"><summary>On this page · ${recipes[cfg.family].title}</summary><nav aria-label="Mobile documentation">${sections.map(([id,name])=>`<a href="#${id}" data-close-menu>${name}</a>`).join('')}<button class="subtle-btn" data-action="search">Search topics</button></nav></details>`; }
function lead(){ const r=recipes[cfg.family]; return `<div class="lead"><div class="crumb"><span>${cfg.view==='playground'?'Explore':'Components'}</span><span aria-hidden="true">/</span><b>${r.title}</b></div><div class="heading-row"><h1>${cfg.view==='playground'?'Make it yours.':r.title}</h1><span class="version">v1 planned</span></div><p class="description">${cfg.view==='playground'?'Find a useful starting point. Tune the appearance, try a loading cycle, then take the code with you.':r.description}</p></div>`; }
function contentHTML(){
 if(outcome==='error') return '<div class="profile-title">Couldn’t load this example</div><p class="body-copy" style="margin:10px 0">The application supplies this error message and decides what happens next.</p><button class="button" data-action="initial">Try again</button>';
 if(outcome==='empty') return '<div class="profile-title">Nothing to show yet</div><p class="body-copy" style="margin-top:12px">An empty result is ready content, too. Create an item in your application to get started.</p>';
 if(cfg.family==='skeleton') return '<div class="profile-top"><span class="avatar" aria-hidden="true">DQ</span><div><div class="profile-title">A little room for good work.</div><div class="profile-subtitle">Workspace notes · Updated just now</div></div></div><p class="body-copy">A calmer start for every interface. Keep useful content close, even while the next thing is loading.</p>';
 if(cfg.family==='text') return '<div class="profile-subtitle">Monthly active readers</div><div class="metrics" style="margin-top:18px"><div class="metric-number">12,480</div><span class="growth">+8.2% this month</span></div><p class="metric-label" style="margin-top:16px">Real text, supplied by your application.</p>';
 return '<div class="profile-top"><div><div class="profile-title">Weekly readership</div><div class="profile-subtitle">A real chart belongs to your application</div></div></div><div style="height:70px;display:flex;gap:10px;align-items:end" aria-label="Illustrative chart, weekly readers rising">'+[32,49,38,61,54,70,63].map(h=>`<span style="height:${h}px;flex:1;background:var(--accent);border-radius:3px 3px 0 0" aria-hidden="true"></span>`).join('')+'</div>';
}
function placeholderHTML(){const n=cfg.family==='chart'?7:cfg.family==='text'?1:cfg.lines; return Array.from({length:n},(_,i)=>`<span class="dotline" style="${cfg.family==='chart'?`height:${[44,68,55,90,76,110,98][i]}px`:`width:${i===n-1&&n>1?'62':'100'}%`}"></span>`).join('');}
function demo(){ return `<section id="demo" class="demo-block" aria-label="Interactive simulated example"><div class="panel-heading"><span>Live example <span style="color:var(--muted);font-size:10px">/ simulated</span></span><span class="state-badge" data-state="ready" data-state-badge>ready</span></div><div class="preview"><div><div class="preview-card" data-preview-card><div data-region aria-busy="false"><div class="placeholder" data-placeholder data-family="${cfg.family}" aria-hidden="true" hidden>${placeholderHTML()}</div><div data-content>${contentHTML()}</div></div><span class="refresh-indicator" data-refresh hidden>Updating</span></div><div class="preview-footer"><i aria-hidden="true"></i><span data-motion-note>Ready content stays readable.</span></div></div></div><div class="demo-actions" role="group" aria-label="Application simulation controls"><button class="button primary" data-action="initial">Initial load</button><button class="button" data-action="refresh">Refresh</button><button class="button" data-action="replace">Replace</button><button class="button" data-action="ready">Show content</button><button class="button" data-action="error">Error</button><button class="button" data-action="empty">Empty</button><button class="button" data-action="hold">Keep loading</button></div><p class="demo-explainer" data-explanation>Your application owns the request. Dotquilt presents its current state.</p></section>`; }
function controls(compact=false){ return `<section class="controls ${compact?'compact':''}" aria-label="Example settings"><h3>Make it yours</h3><div class="fields"><div class="control"><label for="family">Loading surface</label><select id="family" data-setting="family">${Object.entries(recipes).map(([key,r])=>`<option value="${key}" ${cfg.family===key?'selected':''}>${r.title}</option>`).join('')}</select></div><div class="control"><label for="lines">Lines <output data-lines-output>${cfg.lines}</output></label><input id="lines" data-setting="lines" type="range" min="1" max="6" value="${cfg.lines}" ${cfg.family!=='skeleton'?'disabled':''}><small>${cfg.family==='skeleton'?'This example reserves its layout.':'Line count applies to SkeletonText.'}</small></div><div class="control"><label for="dot-color">Loading color</label><input id="dot-color" type="color" data-setting="color" value="${cfg.color}"></div><div class="control"><label class="check-label"><input type="checkbox" data-setting="reduced" ${cfg.reduced?'checked':''}> Preview reduced motion</label><small>System reduced motion always wins.</small></div></div><div class="utility-buttons"><button class="button quiet" data-action="reset">Reset settings</button><button class="button quiet" data-action="share">Copy link</button></div></section>`; }
function snippet(){ const r=recipes[cfg.family], attrs=cfg.family==='skeleton'?` lines={${cfg.lines}}`:cfg.family==='chart'?' variant="line"':'';
 if(cfg.family==='text') return cfg.integration==='react' ? `// Illustrative API — npm scope is not selected yet.\nimport { TextLoader, type LoadingState } from\n  '@YOUR_NPM_SCOPE/dotquilt-react/text';\n\nexport function ReaderCount({ state }: { state: LoadingState }) {\n  return (\n    <TextLoader state={state} mask="00,000"${cfg.reduced?' motion="paused"':''} style={{ color: '${cfg.color}' }}>\n      {12480}\n    </TextLoader>\n  );\n}\n\n/* Scope this variable to the TextLoader host. */\n/* --dotquilt-color: ${cfg.color}; */` : `<!-- Illustrative API — npm scope is not selected yet. -->\n<dotquilt-text id="count" state="ready" mask="00,000">\n  12480\n</dotquilt-text>\n\n<script type="module">\n  import { registerTextLoader } from\n    '@YOUR_NPM_SCOPE/dotquilt/text';\n  registerTextLoader();\n  // The application updates state when its request settles.\n<\/script>\n\n<style>\n  #count { --dotquilt-color: ${cfg.color}; }\n</style>`;
 if(cfg.integration==='react') return `// Illustrative API — npm scope is not selected yet.\nimport { LoadingRegion, type LoadingState } from\n  '@YOUR_NPM_SCOPE/dotquilt-react/region';\nimport { ${r.component} } from\n  '@YOUR_NPM_SCOPE/dotquilt-react/${r.entry}';\n\nexport function Example({ state }: { state: LoadingState }) {\n  return (\n    <LoadingRegion\n      state={state}\n      placeholder={<${r.component}${attrs}${cfg.reduced?' motion="paused"':''} style={{ color: '${cfg.color}' }} />}\n    >\n      <article>Your application’s useful content</article>\n    </LoadingRegion>\n  );\n}\n\n/* Scope to the placeholder host; reserve its block size. */\n/* --dotquilt-color: ${cfg.color}; */`;
 return `<!-- Illustrative API — npm scope is not selected yet. -->\n<dotquilt-region id="example" state="ready">\n  <${r.tag} slot="placeholder"${cfg.family==='skeleton'?` lines="${cfg.lines}"`:cfg.family==='chart'?' variant="line"':''}${cfg.reduced?' motion="paused"':''}>\n  </${r.tag}>\n  <article>Your application’s useful content</article>\n</dotquilt-region>\n\n<script type="module">\n  import { registerLoadingRegion } from\n    '@YOUR_NPM_SCOPE/dotquilt/region';\n  import { ${r.register} } from\n    '@YOUR_NPM_SCOPE/dotquilt/${r.entry}';\n  registerLoadingRegion();\n  ${r.register}();\n  // Use static server markup for pending first paint.\n<\/script>\n\n<style>\n  ${r.tag} { --dotquilt-color: ${cfg.color}; }\n</style>`;
}
function codeBlock(){ return `<details class="code-block" ${matchMedia('(min-width:701px)').matches?'open':''}><summary>Use this configuration <span style="color:var(--muted)" data-code-label>${cfg.integration==='react'?'React':'Web Components'}</span></summary><div class="code-toolbar">${integrations()}<button class="button quiet" data-action="copy-code">Copy illustrative code</button></div><p class="code-note" style="padding:0 16px 10px">Namespace pending · not tested against a shipping package</p><pre tabindex="0" aria-label="Illustrative ${cfg.integration==='react'?'React':'native'} code"><code data-code>${escapeHTML(snippet())}</code></pre></details>`; }
function docSections(){ return `<div class="text-sections"><section class="text-section" id="start"><span class="eyebrow">A useful first step</span><h2 style="margin-top:8px">From placeholder to content.</h2><p data-start-copy>Install the ${cfg.integration==='react'?'React adapter':'native package'} when a release is available, then compose one loading region. The exact npm scope will be selected before release.</p><ol class="steps"><li><span class="step-num">01 / COMPOSE</span><h3>Reserve a space</h3><p>Size the placeholder for the content you expect. Your surrounding layout stays yours.</p></li><li><span class="step-num">02 / CONNECT</span><h3>Set the state</h3><p>Your application passes <code>pending</code>, <code>refreshing</code>, or <code>ready</code>.</p></li><li><span class="step-num">03 / REVEAL</span><h3>Present the outcome</h3><p>Ready can mean useful data, an empty result, or your own recovery interface.</p></li></ol></section><section class="text-section" id="readiness"><h2>Keep the useful things.</h2><p>Use <code>refreshing</code> when the existing content still helps. Use <code>pending</code> when it belongs to a different result. Supplied content stays mounted while its presentation changes.</p><div class="callout"><p>Dotquilt does not fetch your data or decide if it succeeded. Your application rejects stale responses and supplies the latest outcome.</p></div></section><section class="text-section" id="customize"><h2>Fits the space it’s in.</h2><p>Use CSS for size, color, spacing, and type. Local variables belong on the actual loading host. Changing a visual setting must not restart the loading cycle.</p><p style="margin-top:10px"><code>--dotquilt-color</code> uses <code>currentColor</code> by default. This example applies your selected color to its simulated placeholder.</p></section><section class="text-section" id="accessibility"><h2>Motion is optional.</h2><p>Respect system reduced motion and offer a persistent pause control. Automatic decorative motion stops within four seconds; useful content never waits for an effect to finish.</p><p style="margin-top:10px">Your application supplies meaningful loading status and recovery text. Loading surfaces are decorative, with focus and content access handled by the approved region contract.</p></section><section class="text-section" id="reference"><h2>Small, explicit controls.</h2><div class="reference-wrap"><table><thead><tr><th scope="col">Control</th><th scope="col">Default</th><th scope="col">Owner</th></tr></thead><tbody><tr><td><code>state</code></td><td><code>ready</code></td><td>Application</td></tr><tr><td><code>cycle</code></td><td>Optional</td><td>Application</td></tr><tr><td><code>motion</code></td><td><code>system</code></td><td>Loading host</td></tr><tr><td><code>--dotquilt-color</code></td><td><code>currentColor</code></td><td>Loading host</td></tr></tbody></table></div><p style="margin-top:10px;font-size:11px">State and cycle belong to LoadingRegion or TextLoader; decorative placeholders do not own request state.</p></section><section class="text-section" id="releases"><h2>Clear about the limits.</h2><p>v1 is being specified. No public package, measured bundle size, or verified support claim exists yet. Published docs will identify the actual version, tested environments, measured sizes, and migrations.</p><p style="margin-top:10px">Native targets: Chrome/Edge 111, Firefox 123, Safari/iOS 16.4. React 19 and Next.js 16 support still require implementation evidence.</p></section></div><footer class="footer-links"><a href="#start">Getting started ↑</a><a href="#accessibility">Accessibility</a><a href="#releases">Release status</a><span>Three representative recipes in this prototype</span></footer>`; }
function recipesMarkup(){return `<div class="recipe-grid" role="group" aria-label="Choose an example">${Object.entries(recipes).map(([key,r])=>`<button class="recipe-card" data-family="${key}" aria-pressed="${cfg.family===key}"><span class="mini" aria-hidden="true"></span><b>${r.short}</b><small>${r.subtitle}</small></button>`).join('')}</div>`;}
function home(){return `<div class="home-intro"><span class="eyebrow">Composed with care</span><h1 style="margin-top:12px">Make the wait feel considered.</h1><p class="description">Composable loading surfaces, built on Web Components. Keep your layout, your content, and your application in control.</p><div class="home-links"><a class="button primary" href="${escapeHTML(href('docs','start'))}" data-view="docs" data-anchor="start">Start with the docs</a><a class="button" href="${escapeHTML(href('playground'))}" data-view="playground">Try the playground</a></div></div>`;}
function render(direction){
 layoutName=direction; clearPresentation(); presentation='ready'; outcome='content'; document.body.dataset.theme=cfg.theme; document.body.dataset.paused=String(paused); document.body.dataset.reduced=String(cfg.reduced); document.body.dataset.direction=direction;
 const intro=cfg.view==='home'?home():'';
 const note=cfg.view==='playground'?'<p class="playground-note">A local design model. Controls simulate the application; copied snippets are illustrative until the package is implemented and tested.</p>':'';
 let body;
 if(direction==='guide')body=`<div class="layout guide-shell">${sideNav()}<main id="main" class="main-column">${intro}${mobileNav()}${lead()}${note}<div style="margin-bottom:18px">${integrations()}</div>${demo()}<div class="settings-row">${controls(true)}<div style="align-self:center;padding:12px 8px"><div class="under-label">Application controls</div><h3 style="margin-bottom:8px">Watch what stays.</h3><p style="font-size:12px">Refresh keeps the current content useful. Replacement hides it until the next outcome is ready.</p></div></div>${codeBlock()}<div class="utility-row"><p class="status-line" role="status" data-status>Adjust a setting, or try a loading cycle.</p></div>${docSections()}</main><nav class="toc" aria-label="On this page"><b>On this page</b>${sections.map(([id,name])=>`<a href="#${id}">${name}</a>`).join('')}</nav></div>`;
 else if(direction==='workbench')body=`<div class="layout workbench-shell">${sideNav()}<main id="main" class="main-column">${intro}${mobileNav()}${lead()}${note}<div style="margin-bottom:18px">${integrations()}</div><div class="workspace"><div>${demo()}<p class="status-line" role="status" data-status style="padding:12px 0">Adjust a setting, or try a loading cycle.</p>${codeBlock()}</div>${controls()}</div><div class="workbench-notes">${docSections()}</div></main></div>`;
 else body=`<main id="main" class="layout gallery-shell">${intro}${mobileNav()}${lead()}${note}<div style="display:flex;justify-content:center;margin-bottom:24px">${integrations()}</div>${recipesMarkup()}<div class="gallery-workspace">${demo()}<div>${controls(true)}${codeBlock()}</div></div><div class="utility-row"><p class="status-line" role="status" data-status>Choose an example, then tune it to your interface.</p></div>${docSections()}</main>`;
 queueMicrotask(()=>{ applyAppearance(); wireSectionLinks(); });
 return header()+body;
}
function clearPresentation(){ timers.forEach(clearTimeout); timers=[]; clearTimeout(motionBudgetTimer); }
function applyAppearance(){ document.body.dataset.theme=cfg.theme; document.body.dataset.paused=String(paused); document.body.dataset.reduced=String(cfg.reduced); const ph=document.querySelector('[data-placeholder]'); if(ph)ph.style.color=cfg.color; const out=document.querySelector('[data-lines-output]');if(out)out.textContent=cfg.lines; updateMotion(); }
function updateMotion(){const ph=document.querySelector('[data-placeholder]'); const moving=presentation==='pending'&&!paused&&!cfg.reduced&&!osReduced.matches&&!document.hidden&&performance.now()<motionDeadline;ph?.classList.toggle('is-moving',moving);const note=document.querySelector('[data-motion-note]');if(note)note.textContent=presentation==='ready'?'Ready content stays readable.':paused?'Animation paused; readiness still advances.':cfg.reduced||osReduced.matches?'Reduced motion · static placeholder.':presentation==='refreshing'?'Existing content stays visible and interactive.':performance.now()>=motionDeadline?'Motion window ended · content is still pending.':'Decorative motion · bounded to four seconds.';}
function updateCode(){document.querySelectorAll('[data-code]').forEach(el=>el.textContent=snippet());}
function setStatus(text){const el=document.querySelector('[data-status]');if(el)el.textContent=text;}
function setPresentation(next,explanation){presentation=next;const content=document.querySelector('[data-content]'),ph=document.querySelector('[data-placeholder]'),region=document.querySelector('[data-region]'); if(!content||!ph)return;const hide=next==='pending'; if(hide&&content.contains(document.activeElement)){const card=document.querySelector('[data-preview-card]'); card.tabIndex=-1;card.focus({preventScroll:true});} content.hidden=hide;content.inert=hide;ph.hidden=!hide;document.querySelector('[data-refresh]').hidden=next!=='refreshing';region.setAttribute('aria-busy',String(next!=='ready'));const badge=document.querySelector('[data-state-badge]');badge.textContent=next;badge.dataset.state=next;document.querySelector('[data-explanation]').textContent=explanation;updateMotion();}
function begin(kind){const wasReady=presentation==='ready';clearPresentation();const token=++cycle;if(wasReady)motionDeadline=performance.now()+4000;outcome='content';document.querySelector('[data-content]').innerHTML=contentHTML();setPresentation(kind==='refresh'?'refreshing':'pending',kind==='refresh'?'Refreshing: existing useful content stays visible.':'Pending: supplied content is hidden while the new result loads.');setStatus('Simulated application request started.');if(kind!=='hold')timers.push(setTimeout(()=>{if(token!==cycle)return;setPresentation('ready','Ready: your application has supplied its latest useful outcome.');setStatus('Simulated request completed. The package did not fetch data.');},1400));motionBudgetTimer=setTimeout(updateMotion,Math.max(0,motionDeadline-performance.now()));}
async function copy(text,success){try{await navigator.clipboard.writeText(text);setStatus(success);}catch{const d=document.getElementById('search-dialog');if(d.open)d.close();setStatus('Automatic clipboard access unavailable; use the selected text.');const box=document.getElementById('copy-text');box.value=text;document.getElementById('copy-dialog').showModal();box.focus();box.select();}}
function remount(){const y=scrollY;stage.innerHTML=variants[current]();scrollTo(0,y);updateURL();}
function wireSectionLinks(){document.querySelectorAll('[data-close-menu]').forEach(a=>a.addEventListener('click',()=>{const target=document.querySelector(a.getAttribute('href'));if(target){target.tabIndex=-1;target.focus({preventScroll:true});}a.closest('details').open=false;}));}
function searchResults(){const query=document.getElementById('search-input').value.trim().toLowerCase();const filtered=sections.filter(([,name])=>name.toLowerCase().includes(query));document.getElementById('search-results').innerHTML=filtered.length?filtered.map(([id,name])=>`<a href="#${id}" data-search-result>${name}</a>`).join(''):'<p>No matching topic. Try “loading”, “styling”, or “versions”.</p>';}
document.addEventListener('click',e=>{
 const el=e.target.closest('button,a');if(!el)return;
 if(el.dataset.view){e.preventDefault();cfg.view=el.dataset.view;history.pushState(null,'',href(cfg.view,el.dataset.anchor||''));remount();const target=el.dataset.anchor;const main=document.getElementById('main');main.tabIndex=-1;main.focus({preventScroll:true});if(target)document.getElementById(target)?.scrollIntoView();else scrollTo(0,0);return;}
 if(el.dataset.family){e.preventDefault();cfg.family=el.dataset.family;remount();const replacement=document.querySelector(`[data-family="${cfg.family}"]`);replacement?.focus({preventScroll:true});return;}
 if(el.dataset.integration){cfg.integration=el.dataset.integration;document.querySelectorAll('[data-integration]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.integration===cfg.integration)));document.querySelectorAll('[data-code-label]').forEach(b=>b.textContent=cfg.integration==='react'?'React':'Web Components');const startCopy=document.querySelector('[data-start-copy]');if(startCopy)startCopy.textContent=`Install the ${cfg.integration==='react'?'React adapter':'native package'} when a release is available, then compose one loading region. The exact npm scope will be selected before release.`;document.querySelector('pre')?.setAttribute('aria-label',`Illustrative ${cfg.integration==='react'?'React':'native'} code`);updateCode();updateURL();setStatus('Code integration changed. The current loading presentation is preserved.');return;}
 if(el.hasAttribute('data-search-result')){document.getElementById('search-dialog').close();const target=document.querySelector(el.getAttribute('href'));target.tabIndex=-1;target.focus();return;}
 const action=el.dataset.action;if(!action)return;
 if(['initial','refresh','replace','hold'].includes(action)){begin(action);return;}
 if(['ready','error','empty'].includes(action)){clearPresentation();cycle++;outcome=action==='ready'?'content':action;document.querySelector('[data-content]').innerHTML=contentHTML();setPresentation('ready',action==='error'?'Ready: the application supplies its recovery interface immediately.':action==='empty'?'Ready: an empty result is a legitimate outcome.':'Ready: useful content is immediately available.');setStatus(action==='error'?'Simulated request failed; application-owned error content is visible.':action==='empty'?'Application supplied an empty result.':'Application supplied content.');return;}
 if(action==='pause'){paused=!paused;try{localStorage.setItem('dotquilt-prototype-paused',paused?'1':'0');}catch{}el.textContent=(paused?'Resume':'Pause')+' animations';el.setAttribute('aria-pressed',String(paused));applyAppearance();return;}
 if(action==='theme'){cfg.theme=cfg.theme==='light'?'dark':'light';el.textContent=cfg.theme==='light'?'Dark':'Light';el.setAttribute('aria-label',`Switch to ${cfg.theme==='light'?'dark':'light'} theme`);applyAppearance();updateURL();return;}
 if(action==='copy-code'){copy(snippet(),'Illustrative code copied. It has not been verified against a release.');return;}
 if(action==='share'){updateURL();copy(location.href,'Link copied with this direction, integration, and settings.');return;}
 if(action==='reset'){cfg={...cfg,lines:3,color:'#7c8676',reduced:false};remount();document.querySelector('[data-action=reset]')?.focus({preventScroll:true});setStatus('Example settings reset. Your persistent animation preference is unchanged.');return;}
 if(action==='search'){searchResults();document.getElementById('search-dialog').showModal();return;}
 if(action==='close-search')document.getElementById('search-dialog').close();if(action==='close-copy')document.getElementById('copy-dialog').close();
});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){searchResults();return;}const setting=e.target.dataset.setting;if(!setting||setting==='family')return;cfg[setting]=setting==='lines'?asNumber(e.target.value,1,6,3):setting==='reduced'?e.target.checked:e.target.value;if(setting==='lines')document.querySelector('[data-placeholder]').innerHTML=placeholderHTML();applyAppearance();updateCode();updateURL();});
document.addEventListener('change',e=>{if(e.target.dataset.setting==='family'){cfg.family=e.target.value;remount();document.getElementById('family')?.focus({preventScroll:true});}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchResults();document.getElementById('search-dialog').showModal();}});
document.addEventListener('visibilitychange',updateMotion);osReduced.addEventListener('change',updateMotion);
// Keep the harness shortcut from capturing arrows used by buttons, details, or dialogs.
document.addEventListener('keydown',e=>{if(e.target.closest('dialog')||e.target.closest('summary')||e.target.closest('.integration'))e.stopImmediatePropagation();},true);
window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search);cfg.view=['home','docs','playground'].includes(q.get('view'))?q.get('view'):'docs';cfg.integration=q.get('integration')==='native'?'native':'react';cfg.family=Object.hasOwn(recipes,q.get('family'))?q.get('family'):'skeleton';cfg.lines=asNumber(q.get('lines'),1,6,3);cfg.theme=q.get('theme')==='dark'?'dark':'light';cfg.color=/^#[0-9a-f]{6}$/i.test(q.get('color')||'')?q.get('color'):'#7c8676';cfg.reduced=q.get('reduced')==='1';setActive(asNumber(q.get('v'),1,3,1)-1);});
const variants=[()=>render('guide'),()=>render('workbench'),()=>render('gallery')];
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>

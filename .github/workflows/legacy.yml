name: Legacy suites
# Packed-tarball, React-version and Next.js consumer suites (scripts/test-legacy.ts).
# Slow and network-heavy, so they run on demand until they are ported to tests/e2e.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: Space-separated suite names (empty runs all)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:legacy ${{ inputs.suites }}
      - name: Upload test output
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-results
          path: test-results/

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Dotquilt design directions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: a quiet review shell (header, three-up overview, tabs) around full-width specimen pages; each direction carries its own token set. */
:root {
  --s-bg: #F2F3F5;
  --s-fg: #1D1F24;
  --s-muted: #565B66;
  --s-line: #D6D9DF;
  --s-chip: #FFFFFF;
  --s-focus: #1D4ED8;
  --s-font: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --s-bg: #1C1E22; --s-fg: #ECEDEF; --s-muted: #A4A9B3; --s-line: #33363D; --s-chip: #25282D; --s-focus: #8AB4FF; color-scheme: dark; }
}
:root[data-theme="dark"] { --s-bg: #1C1E22; --s-fg: #ECEDEF; --s-muted: #A4A9B3; --s-line: #33363D; --s-chip: #25282D; --s-focus: #8AB4FF; color-scheme: dark; }
body { background: var(--s-bg); color: var(--s-fg); font-family: var(--s-font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* ---------- Direction tokens (light first; dark when the specimen mode is dark) ---------- */
.t-sashiko {
  --bg: #F4F5F8; --surface: #FFFFFF; --ink: #1C2554; --muted: #59607F; --line: #C5CADF;
  --accent: #E3A417; --accent-ink: #1C2554; --focus: #1C2554;
  --dot-on: #2A3570; --dot-off: #2A3570; --dot-hi: #B87A00; --dot-2: #2A3570; --chart: #2A3570;
  --code-bg: #1C2554; --code-fg: #E9ECF7; --code-kw: #F0B63A; --code-str: #AFC4FF; --code-tag: #F7B2C4; --code-fn: #FFFFFF;
  --font-display: 'Zen Maru Gothic', 'Hanken Grotesk', system-ui, sans-serif; --dw: 700; --dstretch: 100%; --dtrack: -0.01em;
  --font-body: 'Hanken Grotesk', system-ui, sans-serif;
  --r-lg: 18px; --r-md: 12px; --r-btn: 999px; --r-sm: 999px;
}
#app[data-mode="dark"] .t-sashiko {
  --bg: #121A3F; --surface: #1A2350; --ink: #EEF0F8; --muted: #A9B0D6; --line: #3A4580;
  --accent: #F0B63A; --accent-ink: #121A3F; --focus: #F0B63A;
  --dot-on: #F1F2F7; --dot-off: #F1F2F7; --dot-hi: #F0B63A; --dot-2: #F1F2F7; --chart: #F0B63A;
  --code-bg: #0C1230; --code-fg: #E9ECF7; --code-kw: #F0B63A; --code-str: #AFC4FF; --code-tag: #F7B2C4; --code-fn: #FFFFFF;
  color-scheme: dark;
}
.t-overprint {
  --bg: #FFFFFF; --surface: #F4F2FB; --ink: #141E52; --muted: #4B4F78; --line: #141E52;
  --accent: #2337A8; --accent-ink: #FFFFFF; --focus: #FF3EA5; --shadow: #FF3EA5;
  --dot-on: #2D4BC4; --dot-off: #2D4BC4; --dot-hi: #2D4BC4; --dot-2: #FF3EA5; --chart: #FF3EA5; --blend: multiply;
  --code-bg: #141E52; --code-fg: #F4F2FB; --code-kw: #FF8ACB; --code-str: #A8BBFF; --code-tag: #FFE36E; --code-fn: #FFFFFF;
  --font-display: 'Archivo', 'Hanken Grotesk', system-ui, sans-serif; --dw: 800; --dstretch: 125%; --dtrack: -0.015em;
  --font-body: 'Archivo', system-ui, sans-serif;
  --r-lg: 6px; --r-md: 4px; --r-btn: 4px; --r-sm: 3px;
}
#app[data-mode="dark"] .t-overprint {
  --bg: #1B1530; --surface: #251D40; --ink: #FFF2FA; --muted: #CDBFE0; --line: #FFF2FA;
  --accent: #FF5CB4; --accent-ink: #1B1530; --focus: #FF5CB4; --shadow: #6E8BFF;
  --dot-on: #6E8BFF; --dot-off: #6E8BFF; --dot-hi: #6E8BFF; --dot-2: #FF5CB4; --chart: #FF5CB4; --blend: screen;
  --code-bg: #120E22; --code-fg: #F4F2FB; --code-kw: #FF8ACB; --code-str: #A8BBFF; --code-tag: #FFE36E; --code-fn: #FFFFFF;
  color-scheme: dark;
}
.t-flipdot {
  --bg: #E6E9EC; --surface: #F7F8F9; --ink: #15181B; --muted: #50575F; --line: #C3C9CF;
  --accent: #F5CE00; --accent-ink: #15181B; --focus: #15181B;
  --dot-on: #15181B; --dot-off: #C3C9CF; --dot-hi: #15181B; --dot-2: #15181B; --chart: #15181B;
  --code-bg: #15181B; --code-fg: #E6E9EC; --code-kw: #F5CE00; --code-str: #9FD3FF; --code-tag: #FFB86B; --code-fn: #FFFFFF;
  --font-display: 'Barlow Condensed', 'Barlow', system-ui, sans-serif; --dw: 600; --dstretch: 100%; --dtrack: 0.002em;
  --font-body: 'Barlow', system-ui, sans-serif;
  --r-lg: 4px; --r-md: 3px; --r-btn: 3px; --r-sm: 2px;
}
#app[data-mode="dark"] .t-flipdot {
  --bg: #16191C; --surface: #1F2327; --ink: #F2F3F4; --muted: #A6ADB4; --line: #3A4046;
  --accent: #F7D400; --accent-ink: #15181B; --focus: #F7D400;
  --dot-on: #F7D400; --dot-off: #353A40; --dot-hi: #F7D400; --dot-2: #F7D400; --chart: #F7D400;
  --code-bg: #0F1113; --code-fg: #E6E9EC; --code-kw: #F7D400; --code-str: #9FD3FF; --code-tag: #FFB86B; --code-fn: #FFFFFF;
  color-scheme: dark;
}

/* ---------- Shell ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 72px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.top h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.1rem); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
.top p { margin: 8px 0 0; color: var(--s-muted); max-width: 62ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--s-line); border-radius: 10px; background: var(--s-chip); padding: 3px; }
.seg button, .sbtn { appearance: none; border: 0; background: transparent; color: var(--s-fg); font: 500 14px/1 var(--s-font); padding: 10px 12px; border-radius: 8px; cursor: pointer; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--s-fg); color: var(--s-bg); }
.sbtn { border: 1px solid var(--s-line); background: var(--s-chip); border-radius: 10px; }
.seg-label { font-size: 13px; color: var(--s-muted); margin-right: 2px; }
:focus-visible { outline: 3px solid var(--s-focus); outline-offset: 2px; }

.overview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 28px; }
@media (min-width: 880px) { .overview { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ov { background: var(--bg); color: var(--ink); font-family: var(--font-body); border: 1px solid var(--s-line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ov h2 { margin: 0; font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); letter-spacing: var(--dtrack); font-size: 28px; line-height: 1.1; }
.ov p { margin: 0; color: var(--muted); }
.strip { display: flex; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.strip span { flex: 1; }
.ov .stage-box { background: var(--surface); border-radius: var(--r-md); padding: 16px; }
.ov .btn { margin-top: auto; align-self: flex-start; }

.tabs { display: flex; gap: 4px 20px; flex-wrap: wrap; border-bottom: 1px solid var(--s-line); margin-top: 40px; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 2px; font: 600 17px var(--s-font); color: var(--s-muted); cursor: pointer; min-height: 48px; }
.tab[aria-selected="true"] { color: var(--s-fg); border-bottom-color: var(--s-fg); }

.dir-head { margin: 28px 0 8px; display: grid; gap: 6px; }
.dir-head h2 { margin: 0; font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); letter-spacing: var(--dtrack); font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1.05; color: var(--s-fg); }
.dir-head p { margin: 0; max-width: 70ch; color: var(--s-muted); font-size: 16px; }
.slabel { margin: 36px 0 10px; font: 600 14px var(--s-font); color: var(--s-muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.slabel small { font-weight: 400; font-size: 13px; }

/* ---------- Specimen pages ---------- */
.dpage { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; border: 1px solid var(--s-line); border-radius: var(--r-lg); overflow: hidden; min-width: 0; }
.dpage :focus-visible, .ov :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.dnav { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 22px; padding: 16px clamp(16px, 4vw, 40px); }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); font-size: 21px; color: var(--ink); text-decoration: none; margin-right: auto; }
.logo svg { width: 26px; height: 26px; flex: none; }
.dnav a.nl { color: var(--ink); text-decoration: none; font-size: 15px; padding: 8px 2px; }
.dnav a.nl:hover { text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px/1 var(--font-body); padding: 13px 20px; min-height: 46px; border-radius: var(--r-btn); border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 9px 14px; min-height: 40px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }

.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 56px); align-items: center; padding: clamp(24px, 5vw, 64px) clamp(16px, 4vw, 40px) clamp(36px, 6vw, 72px); }
.hero h1 { font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); letter-spacing: var(--dtrack); font-size: clamp(2.2rem, 4.8vw, 3.9rem); line-height: 1.03; margin: 0 0 20px; text-wrap: balance; }
.hero .sub { font-size: clamp(1rem, 1.4vw, 1.14rem); color: var(--muted); max-width: 34em; margin: 0 0 28px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.install { margin: 22px 0 0; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.install code { font: 14px 'IBM Plex Mono', ui-monospace, monospace; background: var(--surface); color: var(--ink); padding: 8px 12px; border-radius: var(--r-sm); }
.hero-visual { display: grid; gap: 10px; min-width: 0; }
.hero-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.hero-foot button { appearance: none; background: none; border: 0; color: var(--ink); font: 600 14px var(--font-body); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 10px 0; min-height: 44px; }

.hcard { background: var(--surface); border-radius: var(--r-lg); padding: 20px 22px; display: grid; gap: 12px; }
.hcard-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
.hcard-top span:first-child { color: var(--ink); font-weight: 600; font-size: 15px; }
.hrows { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-variant-numeric: tabular-nums; }
.hrows li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }

/* Stage: real content underneath, dots on a canvas above */
.stage { position: relative; }
.stage > .content { position: relative; }
.stage > canvas.dots { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.stage[data-state="pending"] .content [data-ph], .stage[data-state="pending"] .content [data-part] { opacity: 0; }
.stage[data-state="revealing"] .content [data-ph], .stage[data-state="revealing"] .content [data-part] { opacity: 0; animation: dq-in var(--rd, 400ms) ease-out var(--dl, 0ms) forwards; }
@keyframes dq-in { to { opacity: 1; } }
.stage[data-state="revealing"] .chart-line { stroke-dasharray: 1; animation: dq-draw var(--ld, 500ms) ease-out var(--ldl, 0ms) both; }
@keyframes dq-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
#app[data-reduced] .stage .content [data-ph], #app[data-reduced] .stage .content [data-part] { --dl: 0ms !important; --rd: 200ms !important; }
#app[data-reduced] .stage .chart-line { animation: none !important; }

.glyph-wrap { height: 60px; display: flex; align-items: center; }
.glyph-text { font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); letter-spacing: var(--dtrack); font-size: clamp(38px, 4vw, 50px); line-height: 1; }
.glyph-wrap.big { height: 84px; }
.glyph-wrap.big .glyph-text { font-size: clamp(54px, 6vw, 70px); font-variant-numeric: tabular-nums; }
.chart { display: block; width: 100%; height: 150px; overflow: visible; }
.hcard .chart { height: 160px; }
.chart-line { fill: none; stroke: var(--chart); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart-area { fill: var(--chart); opacity: .12; }
.chart-head { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 8px; }
.chart-head span:first-child { font-weight: 600; }
.chart-head span + span { color: var(--muted); }
.cap { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.lines { margin: 0; line-height: 1.75; }
.lines span { display: block; }
.map { aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-md); overflow: hidden; background: var(--bg); }
.map svg { width: 100%; height: 100%; display: block; }
.map .streets path { stroke: var(--line); stroke-width: 7; fill: none; }
.map .route { stroke: var(--chart); stroke-width: 5; fill: none; stroke-linecap: round; }
.map .stop { fill: var(--accent); }
.map .stop.end { fill: var(--ink); }
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 10px 8px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.bubble { position: relative; background: var(--bg); color: var(--ink); border-radius: 18px 18px 18px 5px; padding: 14px 18px; max-width: 290px; min-height: 52px; display: flex; align-items: center; }
.bubble p { margin: 0; }
.typing-anchor { position: absolute; left: 16px; top: 50%; width: 92px; height: 26px; transform: translateY(-50%); }
.person { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 14px; align-items: center; }
.avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.person h4 { margin: 0; font-size: 17px; font-weight: 600; }
.person .role { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.person .bio { grid-column: 1 / -1; margin: 0; }
.person .btn { grid-column: 1 / -1; justify-self: start; }

/* Component sheet */
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 24px; padding: clamp(20px, 4vw, 36px) clamp(16px, 4vw, 40px) 8px; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); letter-spacing: var(--dtrack); font-size: clamp(1.7rem, 3vw, 2.3rem); line-height: 1.1; }
.sheet-head p { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }
.sheet-head .cta { gap: 8px; }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 18px clamp(16px, 4vw, 40px) clamp(24px, 4vw, 40px); }
@media (min-width: 640px) { .cgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span-md { grid-column: span 2; } }
@media (min-width: 1000px) { .cgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .span-md { grid-column: auto; } .span-lg { grid-column: span 2; } }
.demo { background: var(--surface); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.demo h3 { margin: 0; font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); letter-spacing: var(--dtrack); font-size: 21px; line-height: 1.15; }
.demo .what { margin: -8px 0 0; font-size: 14px; color: var(--muted); }
.demo .stage { flex: 1; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctrl .st { margin-left: auto; font-size: 13px; color: var(--muted); }

/* Docs */
.docs-search { display: flex; align-items: center; gap: 8px; }
.docs-search input { font: 15px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-btn); padding: 10px 14px; min-height: 42px; width: min(220px, 50vw); }
.docs-search input::placeholder { color: var(--muted); }
.docs-body { display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); }
.dside { flex: 1 1 210px; max-width: 250px; padding: 20px clamp(16px, 2vw, 24px) 28px; border-right: 1px solid var(--line); font-size: 15px; }
.dside h3 { font: 600 13px var(--font-body); color: var(--muted); margin: 18px 0 6px; padding-left: 10px; }
.dside h3:first-child { margin-top: 0; }
.dside ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.dside a { display: block; padding: 7px 10px; border-radius: var(--r-sm); color: var(--ink); text-decoration: none; }
.dside a:hover { background: var(--surface); }
.dside a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.dmain { flex: 999 1 520px; min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 48px; }
.dmain > * { max-width: 760px; }
.crumbs { font-size: 14px; color: var(--muted); margin: 0; }
.dmain h1 { font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); letter-spacing: var(--dtrack); font-size: clamp(2rem, 4vw, 2.9rem); line-height: 1.05; margin: 6px 0 12px; }
.dmain h2 { font-family: var(--font-display); font-weight: var(--dw); font-stretch: var(--dstretch); letter-spacing: var(--dtrack); font-size: 24px; line-height: 1.2; margin: 36px 0 10px; }
.dmain p { margin: 0 0 14px; max-width: 65ch; }
.dmain .lead { font-size: 18px; color: var(--muted); }
.preview { background: var(--surface); border-radius: var(--r-md); padding: 18px; margin: 22px 0 8px; display: grid; gap: 14px; }
.preview-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: var(--r-md); padding: 16px 18px; overflow-x: auto; font: 14px/1.65 'IBM Plex Mono', ui-monospace, monospace; }
pre.code .k { color: var(--code-kw); } pre.code .s { color: var(--code-str); } pre.code .t { color: var(--code-tag); } pre.code .f { color: var(--code-fn); font-weight: 500; }
.props { width: 100%; border-collapse: collapse; font-size: 15px; }
.props th, .props td { text-align: left; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.props th { color: var(--muted); font-weight: 600; font-size: 14px; }
.props code { font: 14px 'IBM Plex Mono', ui-monospace, monospace; }
@media (max-width: 720px) {
  .dside { max-width: none; flex-basis: 100%; border-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .dside .grp:not(.cur) { display: none; }
  .dside ul { display: flex; flex-wrap: wrap; gap: 4px; }
}

/* Spec sheet */
.spec { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 18px; padding: clamp(20px, 4vw, 36px) clamp(16px, 4vw, 40px); }
.blk { background: var(--surface); border-radius: var(--r-md); padding: 18px 20px; min-width: 0; }

.blk p, .blk li { font-size: 15px; }

.sw { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }

    if (L < 0.4) return;

  }
  function drawHalftone(ctx, x, y, v, q, p, c, m = 1) {
    let a = 1, g = 0;
    if (q > 0) { g = easeBack(clamp(q / 0.55)); a = 1 - smooth(0.55, 1, q); }

    if (a <= 0.01) return;

    const sx = Math.max(0.12, Math.abs(Math.cos(Math.PI * f)));

    else if (act === 'reveal') s.reveal();
    else if (act === 'replay') {
      if (s.state === 'pending') s.reveal();
      else { s.start(); if (!motionOn()) setTimeout(() => s.reveal(), 700); }
    }
  });
})();
</script>

</body>
</html>
